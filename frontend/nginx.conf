server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Mirrors vite.config.ts's dev-server proxy: strips /api and forwards
    # to the backend service on the compose network — same-origin from the
    # browser's point of view, so no CORS config is needed.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
