<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Grimoire — Fantasy Gamebook</title>
    <meta name="description" content="A Fighting Fantasy-style gamebook powered by an AI Game Master." />
    <!-- Content Security Policy (T098, FR-052): restrict resource origins.
         The Google Fonts *stylesheet* is a <link rel="stylesheet"> — governed
         by style-src (fonts.googleapis.com); the font *binaries* it references
         come from fonts.gstatic.com — governed by font-src (issue #26). -->
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'" />

    <!-- Google Fonts — design tokens from the Fantasy Gamebook prototype -->
    <!-- Cinzel: titles, headings, character names -->
    <!-- EB Garamond: body text, narration, story prose -->
    <!-- JetBrains Mono: stats, labels, nav, tags -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
