# OpenTelemetry Collector config — local dev only
# Receives traces/metrics/logs via OTLP and logs them to stdout.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s

exporters:
  debug:
    verbosity: detailed

  # 8889, not 8888 — 8888 is the collector's own default self-telemetry
  # metrics port (service.telemetry.metrics.address); reusing it here made
  # the collector fail to bind at startup ("address already in use").
  prometheus:
    endpoint: "0.0.0.0:8889"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, prometheus]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
