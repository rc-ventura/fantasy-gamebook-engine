# Dex OIDC provider config — local dev only
# Issues RS256 JWTs for the gamebook test client.
# DO NOT use these credentials in production.
#
# issuer must match OIDC_ISSUER as seen by the *validator* (the backend
# container, which reaches Dex via the compose network as "dex:5556") —
# not the host-published localhost:5556 used to drive the login flow from
# outside. The iss claim is baked into every issued token.

issuer: http://dex:5556/dex

storage:
  type: memory

web:
  http: 0.0.0.0:5556
  # CORS (slice 008): the SPA fetches the token endpoint directly from the
  # browser (PKCE, no backend mediation) — Dex disables CORS on discovery/
  # token/keys endpoints unless allowedOrigins is set explicitly.
  allowedOrigins:
    - http://localhost:5173
    - http://localhost:8080

logger:
  level: info

# Static OAuth2 clients for development / testing
#
# Public client (slice 008, ADR-034): the SPA uses Authorization Code + PKCE
# directly from the browser, so no client_secret exists to protect — `public:
# true` tells Dex to accept a code_verifier instead of a secret at the token
# endpoint. Nothing in this repo ever read the old `secret: gamebook-secret-dev`
# (dead config); redirectURIs are corrected to the origins that actually run
# here (Vite dev server on 5173, docker-compose `gameobs` frontend on 8080) —
# the old localhost:3000/:8000 values matched no running service.
staticClients:
  - id: gamebook
    public: true
    name: "Gamebook Dev Client"
    redirectURIs:
      - http://localhost:5173/callback
      - http://localhost:8080/callback

# Static test passwords — for integration tests only
enablePasswordDB: true
staticPasswords:
  - email: player1@example.com
    # Plaintext: gamebook-test-1 (local test fixture only)
    hash: "$2b$12$DdWCk3LJ7qcdx/GqdHKF2OAdxo4QmTIbENbZuNGn.5Aj7z.pSZzhq"
    username: player1
    userID: "player1-uid"
  - email: player2@example.com
    # Plaintext: gamebook-test-1 (local test fixture only)
    hash: "$2b$12$DdWCk3LJ7qcdx/GqdHKF2OAdxo4QmTIbENbZuNGn.5Aj7z.pSZzhq"
    username: player2
    userID: "player2-uid"

oauth2:
  skipApprovalScreen: true
  responseTypes:
    - code
