# Ignarok adventure module — Layer 1 (fixed backbone) + Layer 2 (probabilistic encounters).
# Layer 3 (free narrative) is the default for every zone absent from both sections below.
#
# Spec: specs/009-deterministic-turn-dispatcher/contracts/adventure-module-schema.md
# Shared template library: adventure_modules/templates.yaml

backbone:
  zones:
    - stone_archway       # entry gate at the mountain's base (difficulty 1)
    - shattered_trailhead # collapsed switchback path, rusted winch (difficulty 1)
    - dark_ravine         # narrow descent scarred by rockfall (difficulty 2)
    - drowned_mines       # flooded gallery tunnels, black water (difficulty 2)
    - sunless_caverns     # natural cathedral lit by pale fungus (difficulty 3)
    - thrall_halls        # Malachar's worked corridors, enslaved minds (difficulty 4)
    - arcane_vaults       # warded laboratories, glyph-trapped floors (difficulty 5)
    - malachars_sanctum   # ritual chamber at the mountain's heart (difficulty 6, boss)

  key_npcs:
    - malachar
    - toll_lurker
    - mind_thrall

  boss: malachar
  victory_condition: { flag: malachar_defeated }
  opening_location: stone_archway

# Layer 2 — rolled once per zone per playthrough, result persisted to World.flags.
# Zones absent here default to Layer 3 (fully narrative-free, no dice).
probabilistic_encounters:
  stone_archway:
    # Always present — the mountain's first threshold is always guarded.
    - id: archway_guardian
      probability: 1.0
      template: combat
      params:
        enemies:
          - { name: "Stone Archway Guardian", skill: 5, stamina: 5 }
        flee_allowed: false

  dark_ravine:
    # A rockfall-scarred passage: one terrain hazard and two creature threats,
    # each rolled independently — creating eight distinct zone states per campaign.
    - id: ravine_rockfall
      probability: 0.7
      template: risky_action
      params:
        risk_amount: 2
        risk_source: environment
    - id: cave_bat
      probability: 0.4
      template: combat
      params:
        enemies:
          - { name: "Cave Bat", skill: 4, stamina: 3 }
        flee_allowed: true
    - id: rogue_goblin
      probability: 0.3
      template: combat
      params:
        enemies:
          - { name: "Rogue Goblin", skill: 5, stamina: 4 }
        flee_allowed: true

  drowned_mines:
    # The flooded crossing — a toll-lurker may or may not be present.
    - id: toll_lurker_encounter
      probability: 0.8
      template: combat
      params:
        enemies:
          - { name: "Toll-Lurker", skill: 6, stamina: 6 }
        flee_allowed: true

  malachars_sanctum:
    # The boss fight — always present, no fleeing, sets the adventure's
    # victory_condition flag on a hero win (CombatRound reads sets_flag_on_win).
    - id: malachar_final_battle
      probability: 1.0
      template: combat
      sets_flag_on_win: malachar_defeated
      params:
        enemies:
          - { name: "Malachar", skill: 10, stamina: 12 }
        flee_allowed: false

# Zones explicitly authored as Layer 3 (free narrative, no dice by design).
# Zones absent from both sections above also default to Layer 3 — listed here
# to make the author's intent explicit and to exercise the narrative-zone path
# in the structural validator (tests/qa/test_adventure_structure.py).
narrative_zones:
  - shattered_trailhead   # atmospheric transition; no dice — tension is spatial
  - sunless_caverns       # discovery zone; encounters are purely narrative encounters

# FR-011 — set only by an actual human reviewer after examining the content.
# A passing structural validator (tests/qa/test_adventure_structure.py) is
# necessary but not sufficient for release — these fields record the human sign-off.
reviewed_by: rc-ventura
reviewed_at: "2026-07-11"
